<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings — LeetCode AI Solver</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    width      : 380px;
    background : #0f1117;
    color      : #e2e8f0;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size  : 13px;
    padding    : 0 0 20px;
  }

  .header {
    background    : #1a1d2e;
    border-bottom : 1px solid #2a2d3e;
    padding       : 14px 16px;
    display       : flex;
    align-items   : center;
    gap           : 10px;
  }

  .back-btn {
    background  : transparent;
    border      : 1px solid #2a2d3e;
    color       : #64748b;
    font-family : monospace;
    font-size   : 11px;
    padding     : 3px 8px;
    cursor      : pointer;
  }

  .back-btn:hover { border-color:#00d4ff; color:#00d4ff; }

  .title {
    font-size      : 13px;
    font-weight    : 700;
    color          : #00d4ff;
    letter-spacing : 1px;
  }

  .body { padding:20px 16px; }

  .section {
    margin-bottom : 24px;
  }

  .section-title {
    font-size      : 10px;
    color          : #64748b;
    letter-spacing : 3px;
    text-transform : uppercase;
    margin-bottom  : 12px;
    padding-bottom : 6px;
    border-bottom  : 1px solid #2a2d3e;
  }

  .field { margin-bottom:12px; }

  .field label {
    display       : block;
    font-size     : 10px;
    color         : #94a3b8;
    letter-spacing: 1px;
    margin-bottom : 5px;
  }

  .field input {
    width       : 100%;
    padding     : 9px 12px;
    background  : #050810;
    border      : 1px solid #2a2d3e;
    color       : #e2e8f0;
    font-family : 'JetBrains Mono', monospace;
    font-size   : 11px;
    transition  : border-color 0.15s;
  }

  .field input:focus {
    outline      : none;
    border-color : #00d4ff;
  }

  .field input::placeholder { color:#2a2d3e; }

  .hint {
    font-size   : 9px;
    color       : #475569;
    margin-top  : 5px;
    line-height : 1.6;
    letter-spacing: 0.5px;
  }

  .hint a { color:#00d4ff; text-decoration:none; }

  .save-btn {
    width          : 100%;
    padding        : 11px;
    background     : linear-gradient(135deg, #00d4ff, #a78bfa);
    border         : none;
    color          : #000;
    font-family    : 'JetBrains Mono', monospace;
    font-size      : 12px;
    font-weight    : 700;
    cursor         : pointer;
    letter-spacing : 2px;
    margin-bottom  : 10px;
  }

  .save-btn:hover { opacity:0.85; }

  .verify-btn {
    width          : 100%;
    padding        : 9px;
    background     : transparent;
    border         : 1px solid #34d399;
    color          : #34d399;
    font-family    : 'JetBrains Mono', monospace;
    font-size      : 11px;
    font-weight    : 700;
    cursor         : pointer;
    letter-spacing : 1px;
    margin-bottom  : 16px;
  }

  .verify-btn:hover { background:rgba(52,211,153,0.1); }

  /* github profile card */
  .profile-card {
    display       : none;
    align-items   : center;
    gap           : 12px;
    padding       : 12px;
    background    : rgba(52,211,153,0.05);
    border        : 1px solid rgba(52,211,153,0.3);
    margin-bottom : 16px;
  }

  .profile-card.show { display:flex; }

  .profile-avatar {
    width        : 36px;
    height       : 36px;
    border-radius: 50%;
    border       : 2px solid #34d399;
  }

  .profile-name {
    font-size   : 12px;
    font-weight : 700;
    color       : #34d399;
  }

  .profile-user {
    font-size : 10px;
    color     : #64748b;
    margin-top: 2px;
  }

  .verified-badge {
    margin-left    : auto;
    font-size      : 9px;
    padding        : 2px 8px;
    background     : rgba(52,211,153,0.2);
    border         : 1px solid #34d399;
    color          : #34d399;
    letter-spacing : 1px;
  }

  /* status message */
  .status {
    font-size   : 10px;
    padding     : 8px 12px;
    margin-top  : 8px;
    letter-spacing: 0.5px;
    line-height : 1.5;
    display     : none;
  }

  .status.show    { display:block; }
  .status.success { background:rgba(52,211,153,0.08); border:1px solid rgba(52,211,153,0.3); color:#34d399; }
  .status.error   { background:rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.3); color:#f87171; }

  /* auto push toggle */
  .toggle-row {
    display         : flex;
    align-items     : center;
    justify-content : space-between;
    padding         : 10px 0;
  }

  .toggle-label {
    font-size : 11px;
    color     : #94a3b8;
  }

  .toggle {
    position : relative;
    width    : 36px;
    height   : 20px;
  }

  .toggle input { opacity:0; width:0; height:0; }

  .toggle-slider {
    position      : absolute;
    inset         : 0;
    background    : #2a2d3e;
    border-radius : 20px;
    cursor        : pointer;
    transition    : 0.3s;
  }

  .toggle-slider::before {
    content       : "";
    position      : absolute;
    width         : 14px;
    height        : 14px;
    left          : 3px;
    top           : 3px;
    background    : #64748b;
    border-radius : 50%;
    transition    : 0.3s;
  }

  .toggle input:checked + .toggle-slider {
    background : rgba(0,212,255,0.3);
  }

  .toggle input:checked + .toggle-slider::before {
    transform  : translateX(16px);
    background : #00d4ff;
  }

  .divider { height:1px; background:#2a2d3e; margin:4px 0 12px; }
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" id="backBtn">← Back</button>
  <span class="title">SETTINGS</span>
</div>

<div class="body">

  <!-- GitHub Section -->
  <div class="section">
    <div class="section-title">GitHub Integration</div>

    <!-- profile card — shown after verify -->
    <div class="profile-card" id="profileCard">
      <img class="profile-avatar" id="profileAvatar" src="" alt="">
      <div>
        <div class="profile-name" id="profileName"></div>
        <div class="profile-user" id="profileUser"></div>
      </div>
      <div class="verified-badge">✓ VERIFIED</div>
    </div>

    <div class="field">
      <label>GITHUB USERNAME</label>
      <input
        type        = "text"
        id          = "githubUsername"
        placeholder = "your-github-username"
      />
    </div>

    <div class="field">
      <label>PERSONAL ACCESS TOKEN</label>
      <input
        type        = "password"
        id          = "githubToken"
        placeholder = "ghp_xxxxxxxxxxxxxxxxxxxx"
      />
      <div class="hint">
        Generate at:
        <a href="https://github.com/settings/tokens" target="_blank">
          github.com/settings/tokens
        </a>
        <br>
        Required scopes: <strong>repo</strong> (full control)
      </div>
    </div>

    <button class="verify-btn" id="verifyBtn">
      ✓ Verify GitHub Connection
    </button>

    <div class="status" id="verifyStatus"></div>

    <div class="divider"></div>

    <!-- auto push toggle -->
    <div class="toggle-row">
      <div class="toggle-label">
        Auto-push when LeetCode shows "Accepted"
      </div>
      <label class="toggle">
        <input type="checkbox" id="autoPushToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <div class="toggle-label">
        Push only when all AI tests pass
      </div>
      <label class="toggle">
        <input type="checkbox" id="aiPassToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

  </div>

  <!-- Save -->
  <button class="save-btn" id="saveBtn">
    💾 &nbsp; SAVE SETTINGS
  </button>

  <div class="status" id="saveStatus"></div>

</div>

<script src="settings.js"></script>
</body>
</html>
